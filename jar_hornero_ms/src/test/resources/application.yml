# Test configuration — overrides main application.yml for @SpringBootTest contexts.
# Uses H2 in-memory so no real PostgreSQL instance is needed.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

app:
  jwt:
    secret: test-hornero-secret-must-be-at-least-32-chars
    expiration-access: 900000
    expiration-refresh: 604800000
  mail:
    resend-api-key: ""
    from-email: ""
    log-only: true
    async: false
  otp:
    ttl-minutes: 15
    max-attempts: 5
    resend-max: 3
    resend-window-minutes: 15
    resend-cooldown-seconds: 60
  donaciones:
    donante-publico: false
  entrega:
    ttl-minutes: 10
    max-attempts: 5
    generar-max: 5
    generar-window-minutes: 15
    generar-cooldown-seconds: 30
  evidencia:
    # Same-thread executor; the s3.* values stay absent, which selects the no-op store.
    async: false
  worker:
    url: ""
  seed:
    # Integration tests rely on the seeded demo accounts (admin@hornero.ar / Admin123! ...).
    demo: true
    super-admin-email: ""
    super-admin-password: ""
