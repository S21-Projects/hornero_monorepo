# Test configuration — overrides main application.yml for @SpringBootTest contexts.
# Uses H2 in-memory so no real PostgreSQL instance is needed.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

app:
  jwt:
    secret: test-hornero-secret-must-be-at-least-32-chars
    expiration-access: 900000
    expiration-refresh: 604800000
