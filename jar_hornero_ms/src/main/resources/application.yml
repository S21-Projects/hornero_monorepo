server:
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-hornero-secret-must-be-at-least-32-chars}
    expiration-access: 900000
    expiration-refresh: 604800000
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    otp-from-email: ${OTP_FROM_EMAIL:}
  otp:
    ttl-minutes: 15
    max-attempts: 5
    resend-max: 3
    resend-window-minutes: 15
    resend-cooldown-seconds: 60
  acreditacion:
    cap-n0: 0
    cap-n1: 3
    cap-n2: 6
    cap-n3: 12
  entrega:
    ttl-minutes: 10
    max-attempts: 5
    generar-max: 5
    generar-window-minutes: 15
    generar-cooldown-seconds: 30
