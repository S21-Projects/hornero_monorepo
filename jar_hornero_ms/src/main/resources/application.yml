server:
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-access: 900000
    expiration-refresh: 604800000
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    # MAIL_FROM_EMAIL wins; OTP_FROM_EMAIL is the pre-N14 name, kept so existing deploys keep working.
    from-email: ${MAIL_FROM_EMAIL:${OTP_FROM_EMAIL:}}
    log-only: ${MAIL_LOG_ONLY:false}
    async: true
  # N14: base URL of the admin SPA (where /restablecer lives); the reset link is built from it,
  # never from request headers.
  panel-url: ${APP_PANEL_URL:http://localhost:5173}
  # N13/D6: event emails (after commit, async) and the admin daily digest. The switch turns both off.
  notificaciones:
    enabled: ${NOTIFICACIONES_ENABLED:true}
    digest-cron: ${NOTIFICACIONES_DIGEST_CRON:0 0 8 * * *}
  password-reset:
    ttl-minutos: ${PASSWORD_RESET_TTL_MINUTOS:30}
  otp:
    ttl-minutes: 15
    max-attempts: 5
    resend-max: 3
    resend-window-minutes: 15
    resend-cooldown-seconds: 60
  donaciones:
    # D5: donor identity on public donation reads. Off = only admin, the donor and the
    # receiving organization's referente see it.
    donante-publico: ${DONANTE_PUBLICO:false}
    # N12/D4: stale-donations job. Unanswered DIRECTA offers / pool proposals are auto-resolved
    # after their window; accepted/en-camino and pending-confirmation donations are only flagged.
    oferta-sin-respuesta-dias: ${DONACIONES_OFERTA_SIN_RESPUESTA_DIAS:7}
    propuesta-sin-respuesta-dias: ${DONACIONES_PROPUESTA_SIN_RESPUESTA_DIAS:3}
    en-curso-estancada-dias: ${DONACIONES_EN_CURSO_ESTANCADA_DIAS:14}
    confirmacion-estancada-dias: ${DONACIONES_CONFIRMACION_ESTANCADA_DIAS:7}
    estancadas-cron: ${DONACIONES_ESTANCADAS_CRON:0 15 0 * * *}
  acreditacion:
    cap-n0: 0
    cap-n1: 3
    cap-n2: 6
    cap-n3: 12
  entrega:
    ttl-minutes: 10
    max-attempts: 5
    generar-max: 5
    generar-window-minutes: 15
    generar-cooldown-seconds: 30
  actividad:
    # N10: activity-log retention. Provisional default until D12 (PII retention) is decided.
    retencion-dias: ${ACTIVIDAD_RETENCION_DIAS:365}
  idempotencia:
    # N11: Idempotency-Key retention. A repeated key within the TTL replays the original response;
    # after it the key is a new operation. An EN_PROCESO key older than en-proceso-max-minutos is
    # treated as abandoned (crashed request) and can be taken over.
    ttl-horas: ${IDEMPOTENCIA_TTL_HORAS:24}
    en-proceso-max-minutos: 2
  rondas:
    # N7/D7: optional scheduled ronda. Off by default (rondas are manual).
    auto:
      enabled: ${RONDAS_AUTO_ENABLED:false}
      cron: ${RONDAS_AUTO_CRON:0 0 6 * * *}
  worker:
    url: ${WORKER_URL:}
