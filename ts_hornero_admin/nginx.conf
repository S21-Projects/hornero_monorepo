server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Hashed build assets — safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in this block hides the server-level ones, so repeat them.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA history fallback: every unknown path resolves to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
