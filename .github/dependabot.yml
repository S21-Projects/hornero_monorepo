# Major versions are upgraded by hand. Minor and patch updates arrive as one grouped PR per
# directory, so each ecosystem opens at most one version-update PR a week.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/ts_hornero_bff"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
