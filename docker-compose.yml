services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_NAME:-hornero}"
      POSTGRES_USER: "${DB_USERNAME:-hornero}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-hornero}"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - hornero_pgdata:/var/lib/postgresql/data
    networks:
      - hornero
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hornero} -d ${DB_NAME:-hornero}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ms:
    build:
      context: ./jar_hornero_ms
    ports:
      - "${SERVER_PORT:-8081}:8081"
    environment:
      SERVER_PORT: "${SERVER_PORT:-8081}"
      JWT_SECRET: "${JWT_SECRET}"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-hornero}"
      DB_USERNAME: "${DB_USERNAME:-hornero}"
      DB_PASSWORD: "${DB_PASSWORD:-hornero}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hornero
    healthcheck:
      # springdoc's OpenAPI JSON is public (permitAll) and 200s once the app is up.
      # Avoids needing spring-boot-starter-actuator just for a liveness probe.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/v3/api-docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  bff:
    build:
      context: ./ts_hornero_bff
    ports:
      - "${BFF_PORT:-3001}:3001"
    environment:
      PORT: "3001"
      JAVA_MS_URL: "http://ms:8081"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      NODE_ENV: "production"
      AWS_S3_BUCKET_NAME: "${AWS_S3_BUCKET_NAME}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-auto}"
      AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL}"
    depends_on:
      ms:
        condition: service_healthy
    networks:
      - hornero

  app:
    build:
      context: ./ts_hornero_app
      args:
        NEXT_PUBLIC_BFF_URL: "${NEXT_PUBLIC_BFF_URL:-http://localhost:3001}"
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      # Server-side internal URL — reached over the compose network, not localhost.
      BFF_BASE_URL: "http://bff:3001"
    depends_on:
      - bff
    networks:
      - hornero

networks:
  hornero:
    driver: bridge

volumes:
  hornero_pgdata:
